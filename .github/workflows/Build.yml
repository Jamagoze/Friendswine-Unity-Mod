name: Build Unity Dance module
on:
  push:
    paths: ['unity_dance_src.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          unzip -o unity_dance_src.zip -d src
          curl -L https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -o src/zygisk.hpp
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}
          mkdir -p src/module/zygisk
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S src -B build/$ABI -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$ABI -j
            cp build/$ABI/libunitydance.so src/module/zygisk/$ABI.so
          done
          cd src/module && zip -r9 ../../UnityDance.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: UnityDance
          path: UnityDance.zip
